
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elvonis Visiting Card</title>

    <style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    margin: 0;
    padding: 50px;
    background-color: #1a0508;
    font-family: Arial, sans-serif;
}

.card {
    width: 380px;
   
    margin: 20px auto;
    padding: 30px;
    background-color: #080808;
    border: 2px solid #d4af37;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 25px rgba(180, 15, 35, 0.25);
}

.company-name {
    color: #d4af37;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.tagline {
    color: #c5a9a9;
    font-size: 11px;
    letter-spacing: 2px;
}

.divider {
    width: 80px;
    height: 2px;
    margin: 25px auto;
    background-color: #b5122b;
}

.initial {
    width: 85px;
    height: 85px;
    margin: 0 auto 15px;
    padding-top: 20px;
    border: 2px solid #d4af37;
    border-radius: 50%;
    color: #d4af37;
    font-size: 32px;
    font-weight: bold;
    background-color: #29070d;
}

.person-name {
    color: #ffffff;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.designation {
    color: #e31b3d;
    font-size: 13px;
    letter-spacing: 2px;
}

.employee-id {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 14px;
    border: 1px solid #d4af37;
    border-radius: 20px;
    color: #d4af37;
    font-size: 11px;
}

.contact-section {
    margin-top: 25px;
    padding: 18px;
    border-top: 1px solid #7d1828;
    text-align: left;
}

.contact-item {
    margin: 12px 0;
    color: #eeeeee;
    font-size: 13px;
}

.label {
    display: inline-block;
    width: 75px;
    color: #d4af37;
    font-weight: bold;
}

.footer {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #7d1828;
    color: #d4af37;
    font-size: 11px;
    letter-spacing: 1px;
}

    </style>

    <link rel="icon" href="./Luxurious_Gold_and_Crimson_E_Emblem_icon.png">
</head>

<body>

    <div class="card">

        <div class="company-name">
            ELVONIS
        </div>

        <div class="tagline">
            PREMIUM BUSINESS SOLUTIONS
        </div>

        <div class="divider"></div>

        <div class="initial">
            BT
        </div>

        <div class="person-name">
            Bharath kumar Talluri
        </div>

        <div class="designation">
            JAVA DEVELOPER
        </div>

        <span class="employee-id">
            EMP ID : EVN-1024
        </span>

        <div class="contact-section">

            <div class="contact-item">
                <span class="label">EMAIL</span>
                <span>bharath@example.com</span>
            </div>

            <div class="contact-item">
                <span class="label">PHONE</span>
                <span>+91 7093******</span>
            </div>

            <div class="contact-item">
                <span class="label">WEBSITE</span>
                <span>www.elvonis.com</span>
            </div>

            <div class="contact-item">
                <span class="label">LOCATION</span>
                <span>Hyderabad, India</span>
            </div>

        </div>

        <div class="footer">
            CONNECT • CREATE • GROW
        </div>

    </div>

</body>
</html>
