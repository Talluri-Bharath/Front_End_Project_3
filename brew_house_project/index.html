
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BREW HOUSE - Coffee Card</title>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="./images/favicon.png">
</head>

<body>

    <div id="main-container">

        <div class="coffee-card">

            <div class="image-container">

                <img src="./images/Warm_Brew_House_Cappuccino.png"
                     alt="Cappuccino Coffee">

                <span class="popular-badge">BEST SELLER</span>

            </div>

            <div class="coffee-details">

                <p class="category">PREMIUM COFFEE</p>

                <h1>Cappuccino</h1>

                <div class="rating">
                    <li class="bi bi-star-fill"></li> 4.8 <span>(120 Reviews)</span>
                </div>

                <p class="description">
                    Experience the perfect blend of rich espresso,
                    steamed milk and creamy foam in every sip.
                </p>

                <div class="size-section">

                    <h3>Choose Your Size</h3>

                    <div class="sizes">

                        <span>Small</span>

                        <span>Medium</span>

                        <span>Large</span>

                    </div>

                </div>

                <div class="price-section">

                    <div>
                        <p class="price-label">Price</p>
                        <h2>₹180</h2>
                    </div>

                    <a href="#" class="cart-button">
                        Add to Cart
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
