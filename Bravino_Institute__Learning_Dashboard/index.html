
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Learning Dashboard</title>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="./Glossy_Bravino_Institute_Emblem.png">

</head>

<body>

    <div class="header">

        <div class="logo">
            BRAVINO
        </div>

        <div class="menu">

            <span class="menu-item">
                Dashboard
            </span>

            <span class="menu-item">
                Courses
            </span>

            <span class="menu-item">
                Profile
            </span>

        </div>

    </div>


  

    <div class="dashboard">



        <div class="profile">

            <div class="profile-details">

                <span class="student-name">
                    Bharath Kumar
                </span>

                <span class="student-role">
                    Java Developer
                </span>

                <span class="batch">
                    Batch : JAVA
                </span>

            </div>

            <span class="status">
                ACTIVE
            </span>

        </div>


        <div class="statistics">

            <div class="section-title">
                Learning Statistics
            </div>

            <div class="stats-container">

                <div class="stat-card">

                    <span class="stat-number">
                        12
                    </span>

                    <span class="stat-label">
                        Total Courses
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-number">
                        8
                    </span>

                    <span class="stat-label">
                        Completed
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-number">
                        4
                    </span>

                    <span class="stat-label">
                        Pending
                    </span>

                </div>

            </div>

        </div>



        <div class="skills-section">

            <div class="section-title">
                Technical Skills
            </div>

            <div class="skills-container">

                <span class="skill">
                    Java
                </span>

                <span class="skill">
                    HTML
                </span>

                <span class="skill">
                    CSS
                </span>

                <span class="skill">
                    JavaScript
                </span>

                <span class="skill">
                    SQL
                </span>

            </div>

        </div>



        <div class="notification">

            New Java Advanced Module is available. Keep learning!

        </div>



        <div class="footer">

            <span class="footer-text">
                KEEP LEARNING • KEEP GROWING
            </span>

        </div>


    </div>

</body>

</html>
